        rel="stylesheet">


</head>

        </div>

        <div class="div-logo"></div>

    </header>


    <section class="pedido">

        <h2>Faça seu pedido</h2>

        <p class="texto-pedido">
            Preencha as informações abaixo para encomendar seu bolo.
        </p>

        <form action="#" method="post">

            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>


            <div class="campo">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                <p id="mensagem-cep"></p>
            </div>

            <div class="campo">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" name="rua" required>
            </div>

            <div class="campo">
                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" placeholder="Número da residência" required>
            </div>

            <div class="campo">
                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" name="complemento" placeholder="Apartamento, casa, etc.">
            </div>

            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>

            <div class="campo">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
            </div>


            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <div class="campo">
                <label for="item">Escolha seu bolo:</label>

                <select id="item" name="item" required>
                    <option value="">Selecione um bolo</option>
                    <option value="Bolo de Kinder">Bolo de Kinder</option>
                    <option value="Bolo de Morango">Bolo de Morango</option>
                    <option value="Bolo de Red Velvet">Bolo de Red Velvet</option>
                    <option value="Bolo de Prestígio">Bolo de Prestígio</option>
                    <option value="Bolo Branco de Avelã">Bolo Branco de Avelã</option>
                    <option value="Bolo de Limão">Bolo de Limão</option>
                </select>
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade de bolos:</label>
                <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>
            </div>

            <div class="campo">
                <label for="total">Valor total (R$):</label>
                <input type="number" id="total" name="total" min="0" step="0.01" placeholder="0,00" required>
            </div>

            <div class="campo">
                <label for="pagamento">Forma de pagamento:</label>

                <select id="pagamento" name="pagamento" required>
                    <option value="">Selecione uma opção</option>
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão de débito">Cartão de débito</option>
                    <option value="Cartão de crédito">Cartão de crédito</option>
                </select>
            </div>

            <button type="submit">Finalizar pedido</button>

        </form>

    </section>
